name: Build SDL web

on:
  push:
    branches: [ master, pages ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Git Repo
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'

    - name: Setup emscripten
      uses: emscripten-core/setup-emsdk@v16
      with:
        version: 'latest'

    - name: Build cemu.html
      run: |
        make -C core -f emscripten.mk libcemucore.a
        emmake make -C gui/sdl appname=cemu.html \
            CC=emcc CCFLAGS="-std=c99 -O2 -Wall -Wextra --use-port=sdl2"

    - name: Make web directory
      run: |
        mkdir _site
        mv gui/sdl/cemu.{html,js,wasm} _site

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
